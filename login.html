{% extends "auth_base.html" %}

{% block title %}Login | IIPS Internship Management System{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-header">
            <h1>Welcome Back</h1>
            <p>Login to your IIPS Internship Management account</p>
        </div>

        <form method="POST">

            <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    class="form-control"
                    placeholder="Enter your email"
                    required
                >
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    name="password"
                    class="form-control"
                    placeholder="Enter your password"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary auth-button">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{{ url_for('register') }}">Create an account</a>
        </p>

    </div>

</div>

{% endblock %}
